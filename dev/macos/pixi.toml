# ROS 2 Jazzy on macOS (Apple Silicon) via RoboStack, for development without Docker.
# The robot and CI use the Docker images; this is only a convenience for Macs.
#
# The repo path contains a space ("Pib George"); ROS setup scripts and make break on that.
# So the environment and the colcon workspace live outside the repo:
#   ~/.pixi/bin/pixi config set --local detached-environments "$HOME/.pixi-envs"   (once)
#   workspace: ~/.cache/georg-ros-ws/{build,install,log}
#
#   ~/.pixi/bin/pixi install --manifest-path dev/macos/pixi.toml
#   ~/.pixi/bin/pixi run --manifest-path dev/macos/pixi.toml build
#   ~/.pixi/bin/pixi shell --manifest-path dev/macos/pixi.toml   # shell with ROS sourced
[workspace]
name = "georg-ros-macos"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-action-msgs = "*"
ros-jazzy-launch-ros = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-slam-toolbox = "*"
ros-jazzy-foxglove-bridge = "*"
ros-jazzy-rosbag2 = "*"
ros-jazzy-rosbag2-storage-mcap = "*"
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
pyyaml = "*"
pytest = "*"
flake8 = "*"
mujoco = "*"
websockets = "*"

[pypi-dependencies]
apache-burr = { version = "==0.43.0", extras = ["tracking-client"] }

[activation]
scripts = ["activate.sh"]

[activation.env]
ROS_DISTRO = "jazzy"
ROS_VERSION = "2"
ROS_PYTHON_VERSION = "3"
# local only: no DDS traffic to the robot network from a laptop
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
GEORG_WS = "$HOME/.cache/georg-ros-ws"

[tasks]
# macOS strips DYLD_LIBRARY_PATH when bash starts (SIP), so every task re-sources the workspace.
# builds every ROS package in packages/ (the audio package builds, but its TensorFlow deps are not installed)
build = { cmd = "colcon --log-base $GEORG_WS/log build --build-base $GEORG_WS/build --install-base $GEORG_WS/install --symlink-install --cmake-args -G Ninja --base-paths ../../packages", cwd = "." }
test = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 && cd ../../packages/pkg_task_manager/task_manager && python -m pytest -q test/test_burr_app.py test/test_validator.py test/test_planner.py && cd ../../pkg_command_gate/command_gate && python -m pytest -q test && cd ../../pkg_sim/georg_sim && python -m pytest -q test'", cwd = "." }
# P2: task manager node + mock packages over real ROS (all mandatory scenarios, ~1 min)
test_ros = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 GEORG_ROS_TESTS=1 && cd ../../packages/pkg_task_manager/task_manager && python -m pytest -v test/test_ros_integration.py'", cwd = "." }
# P3: whole profile sim in one command (simulator, SLAM, navigation, task manager, mocks, gate)
# simulator:=simmj for MuJoCo (stage 2)
sim = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && ros2 launch ../../packages/pkg_sim/config/sim_stack.launch.py'", cwd = "." }
sim_mj = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && ros2 launch ../../packages/pkg_sim/config/sim_stack.launch.py simulator:=simmj'", cwd = "." }
# P3: simulator + SLAM + real navigation + task manager (~2 min)
test_sim = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 GEORG_ROS_TESTS=1 && cd ../../packages/pkg_task_manager/task_manager && python -m pytest -v test/test_sim_integration.py'", cwd = "." }
test_sim_mj = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 GEORG_ROS_TESTS=1 GEORG_SIMULATOR=simmj && cd ../../packages/pkg_task_manager/task_manager && python -m pytest -v test/test_sim_integration.py'", cwd = "." }
# P4: operate the task manager through foxglove_bridge like Lichtblick does, plus the panel tests
test_lichtblick = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 GEORG_ROS_TESTS=1 && cd ../../packages/pkg_task_manager/task_manager && python -m pytest -v test/test_lichtblick_bridge.py && cd ../../pkg_viz/lichtblick_panel && python3 build.py && node --test test/model.test.js test/panel.test.js'", cwd = "." }
# P5: record in the simulator, strip to raw sensors, replay twice with SLAM + Burr (~2 min)
test_mcap = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 GEORG_ROS_TESTS=1 && cd ../../packages/pkg_task_manager/task_manager && python -m pytest -v test/test_mcap_integration.py && cd ../../../tests/decision_replay && python -m pytest -q test_replay.py'", cwd = "." }
# decision replay of a recorded run: pixi run replay <burr_app_id> [--runs 3]
replay = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && python ../../tests/decision_replay/replay.py \"$@\"' replay", cwd = "." }
# continuous recording of /georg/task_manager/* like the compose service recorder
record = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && mkdir -p ../../recordings && ros2 bag record -s mcap --max-bag-duration 3600 -o ../../recordings/task_manager_$(date +%Y%m%d_%H%M%S) --regex \"/georg/task_manager/.*|/georg/task/current_task\"'", cwd = "." }
# P6: operating modes + LLM planner over ROS with a scripted LLM (~1 min)
test_llm = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 GEORG_ROS_TESTS=1 && cd ../../packages/pkg_task_manager/task_manager && python -m pytest -v test/test_llm_integration.py'", cwd = "." }
# P6 with a real local LLM (start it first: pixi run -e llm llm_server)
test_llm_real = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 GEORG_ROS_TESTS=1 GEORG_LLM_REAL=1 && cd ../../packages/pkg_task_manager/task_manager && python -m pytest -v -s test/test_llm_real.py'", cwd = "." }
# runs the task manager node (Idle, start missions via the services)
task_manager = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && ros2 run task_manager task_manager --ros-args -r __ns:=/georg'", cwd = "." }
# mock packages; scenario via GEORG_MOCK_SCENARIO (all_ok, one_fails, timeout, abort, unreachable, retry_then_ok)
mock_packages = { cmd = "bash -c 'source $GEORG_WS/install/setup.bash && ros2 run task_manager mock_packages --ros-args -r __ns:=/georg'", cwd = "." }
# shell with ROS and the workspace loaded
ros = { cmd = "bash --rcfile $GEORG_WS/install/setup.bash -i", cwd = "." }

# Burr UI in its own small environment (its server deps clash with the ROS packages)
[feature.ui.dependencies]
python = "3.12.*"

[feature.ui.pypi-dependencies]
apache-burr = { version = "==0.43.0", extras = ["tracking"] }

[feature.ui.tasks]
burr_ui = "burr_path=$HOME/.burr python -m uvicorn burr.tracking.server.run:app --host 127.0.0.1 --port 7241"

# local LLM for the planner (P6): llama.cpp server with an OpenAI-compatible endpoint
[feature.llm.dependencies]
"llama.cpp" = "*"

[feature.llm.tasks]
# downloads the model once (~1 GB) to ~/.cache/georg-llm
llm_model = "mkdir -p $HOME/.cache/georg-llm && test -f $HOME/.cache/georg-llm/qwen2.5-1.5b-instruct-q4_k_m.gguf || curl -sSL --fail -o $HOME/.cache/georg-llm/qwen2.5-1.5b-instruct-q4_k_m.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
# http://localhost:8080/v1/chat/completions (GEORG_LLM_URL default)
llm_server = "llama-server -m $HOME/.cache/georg-llm/qwen2.5-1.5b-instruct-q4_k_m.gguf --host 127.0.0.1 --port 8080 --ctx-size 8192 -ngl 99"

[environments]
ui = { features = ["ui"], no-default-feature = true }
llm = { features = ["llm"], no-default-feature = true }
