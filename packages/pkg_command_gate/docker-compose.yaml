services:
  command_gate:
    image: command_gate
    # runs in every profile as a second safety net; forwards only in 'real'
    profiles: [mock, sim, real, mcap]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - ./config:/config:ro
    environment:
      # set by projectctl.bash: profile that was started, and content of /etc/georg/mode
      - GEORG_PROFILE=${GEORG_PROFILE:-}
      - GEORG_DEVICE_MODE=${GEORG_DEVICE_MODE:-}
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/jazzy/setup.sh && . /ws/install/setup.sh && ros2 node list | grep -q /georg/command_gate"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    command: ros2 launch /config/command_gate.launch.py

networks:
  pib-network:
    driver: bridge
