services:
  drive:
    image: drive
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - /dev:/dev
      - ./config:/config:ro
    privileged: true
    restart: always
    init: true
    working_dir: /config
    command: ros2 launch drive.launch.py
#    command: ros2 launch drive.launch.py robot_namespace:=georg
    # command: sleep 1d

networks:
  pib-network:
    driver: bridge
