services:
  drive:
    image: drive
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    # sim: Sam's sim_mode, twist_mux + twist_limiter without the driver edu_robot
    profiles: [sim, real]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - /dev:/dev
      - ./config:/config:ro
    privileged: true
    restart: always
    init: true
    working_dir: /config
    command: ros2 launch drive.launch.py sim_mode:=${GEORG_SIM_MODE:-false}
#    command: ros2 launch drive.launch.py robot_namespace:=georg
    # command: sleep 1d

networks:
  pib-network:
    driver: bridge
