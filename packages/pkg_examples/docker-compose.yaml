services:
  examples:
    image: examples
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    profiles: [examples]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - ./config:/config:ro
    privileged: true
    init: true
    command: ros2 launch /config/examples.launch.py sim_mode:=${GEORG_SIM_MODE:-false}
#    command: ros2 launch /config/examples.launch.py robot_namespace:=georg
    # command: sleep 1d

networks:
  # Shared with pib-backend and Cerebra (same fixed name): ROS 2 nodes can always reach each
  # other on the network, the ROS domain alone separates them (real = 0 like pib-backend,
  # mock/sim/mcap = 30). See docs/DECISIONS.md "One network, domains separate".
  pib-network:
    name: pib-network
    driver: bridge
