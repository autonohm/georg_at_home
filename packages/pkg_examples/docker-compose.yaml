services:
  examples:
    image: examples
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - ./config:/config:ro
    privileged: true
    init: true
    command: ros2 launch /config/examples.launch.py
#    command: ros2 launch /config/examples.launch.py robot_namespace:=georg
    # command: sleep 1d

networks:
  pib-network:
    driver: bridge
