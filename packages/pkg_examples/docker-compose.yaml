services:
  examples:
    image: examples
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    profiles: [examples]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - ./config:/config:ro
    privileged: true
    init: true
    command: ros2 launch /config/examples.launch.py sim_mode:=${GEORG_SIM_MODE:-false}
#    command: ros2 launch /config/examples.launch.py robot_namespace:=georg
    # command: sleep 1d

networks:
  pib-network:
    driver: bridge
