services:
  gestures:
    image: gestures
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    profiles: [sim, real]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - ./config:/config:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/jazzy/setup.sh && . /ws/install/setup.sh && ros2 node list | grep -qx /pib_gestures_server"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    command: ros2 launch /config/gestures.launch.py

networks:
  # Shared with pib-backend and Cerebra (same fixed name): ROS 2 nodes can always reach each
  # other on the network, the ROS domain alone separates them (real = 0 like pib-backend,
  # mock/sim/mcap = 30). See docs/DECISIONS.md "One network, domains separate".
  pib-network:
    name: pib-network
    driver: bridge
