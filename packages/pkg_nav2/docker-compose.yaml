services:
  # Nav2 on the live SLAM map (config/nav2.launch.py); goals via the action navigate_to_pose
  nav2:
    image: nav2
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - ./config:/config:ro
    init: true
    restart: unless-stopped
    command: ros2 launch /config/nav2.launch.py

networks:
  pib-network:
    driver: bridge
