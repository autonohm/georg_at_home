services:
  navigation:
    image: navigation
    profiles: [sim, real]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - ./config:/config:ro
      # maps live in pkg_slam (debug fallback, the map is built by SLAM)
      - ../pkg_slam/maps:/root/georg_maps:ro
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - GEORG_MAP_DIR=/root/georg_maps
      - GEORG_DEFAULT_MAP=${GEORG_MAP:-Nav_Test.yaml}
      # profile real: drive commands via twist_mux / twist_limiter (navigation.launch.py)
      - GEORG_PROFILE=${GEORG_PROFILE:-}
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/jazzy/setup.sh && . /ws/install/setup.sh && ros2 node list | grep -qx /drive_route_action_server"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    command: ros2 launch /config/navigation.launch.py

networks:
  # Shared with pib-backend and Cerebra (same fixed name): ROS 2 nodes can always reach each
  # other on the network, the ROS domain alone separates them (real = 0 like pib-backend,
  # mock/sim/mcap = 30). See docs/DECISIONS.md "One network, domains separate".
  pib-network:
    name: pib-network
    driver: bridge
