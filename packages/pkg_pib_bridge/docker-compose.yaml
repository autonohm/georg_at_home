# Bridge to pib-backend. Optional: GEORG_WITH_PIB_BACKEND=1 ./projectctl.bash up sim|real
services:
  pib_bridge:
    image: pib_bridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # domain of pib-backend (its containers use the default 0)
      - PIB_BACKEND_DOMAIN_ID=${PIB_BACKEND_DOMAIN_ID:-0}
      # optional std_msgs/Bool topic for the doorbell (pib-backend has none)
      - PIB_DOORBELL_TOPIC=${PIB_DOORBELL_TOPIC:-}
      # false: do not wait until spoken (machine without loudspeaker, see docs Q37)
      - PIB_SAY_JOIN=${PIB_SAY_JOIN:-true}
      # pib/pose on the robot: dry run unless 1 (then poses go to the real servos)
      - PIB_POSE_ENABLE=${PIB_POSE_ENABLE:-0}
    profiles: [pib]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      # named poses and joint limits (shared with the fake motors of pkg_pib_model)
      - ../pkg_pib_model/config:/config:ro
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/jazzy/setup.sh && . /ws/install/setup.sh && ros2 node list | grep -qx /pib_bridge"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    command: ros2 run pib_bridge pib_bridge

networks:
  # Shared with pib-backend and Cerebra (same fixed name): ROS 2 nodes can always reach each
  # other on the network, the ROS domain alone separates them (real = 0 like pib-backend,
  # mock/sim/mcap = 30). See docs/DECISIONS.md "One network, domains separate".
  pib-network:
    name: pib-network
    driver: bridge
