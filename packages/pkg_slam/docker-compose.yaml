services:
  slam:
    image: slam
    profiles: [sim, real, mcap]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - /dev:/dev
      - ./config:/config:ro
    privileged: true
    restart: unless-stopped
    init: true
    working_dir: /config
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - GEORG_PROFILE=${GEORG_PROFILE:-}
      - GEORG_SIM_MODE=${GEORG_SIM_MODE:-false}
    # real: pkg_slam.launch.py with sim_mode from main (GEORG_SIM_MODE).
    # sim / mcap: own launch files for now, because the simulator (pkg_sim) publishes the
    # odom tf itself and no /clock yet; switch to sim_mode in plan phase 4.
    command: ["sh", "-c", "case \"$$GEORG_PROFILE\" in sim) ros2 launch slam_sim.launch.py ;; mcap) ros2 launch slam_mcap.launch.py ;; *) ros2 launch pkg_slam.launch.py sim_mode:=$$GEORG_SIM_MODE ;; esac"]
    # command: sleep 1d

networks:
  pib-network:
    driver: bridge
