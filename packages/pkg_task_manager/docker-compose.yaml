services:
  task_manager:
    image: task_manager
    profiles: [mock, sim, real, mcap]
    build:
      context: .
      dockerfile: ./Dockerfile
      additional_contexts:
        navigation: ../pkg_navigation
    networks:
      - pib-network
    volumes:
      - ./config:/config:ro
      - ../pkg_slam/maps:/root/georg_maps:ro
      - burr-data:/root/.burr
    environment:
      - GEORG_MAP_DIR=/root/georg_maps
      - GEORG_DEFAULT_MAP=Nav_Test.yaml
      # set by projectctl.bash; the task manager checks the catalog modes against it
      - GEORG_PROFILE=${GEORG_PROFILE:-}
      # no MISSION_ID: the node starts in Idle, missions are started via
      # ros2 service call /georg/task_manager/start (plan: boot never starts a mission)

    privileged: true
    init: true
    restart: unless-stopped
    command: ros2 launch /config/task_manager.launch.py
    # command: sleep 1d

  # Mock packages (P2): fake action servers for speech, gestures, navigation + odom.
  # Scenario via GEORG_MOCK_SCENARIO (all_ok, one_fails, timeout, abort, unreachable, retry_then_ok)
  mock_packages:
    image: task_manager
    pull_policy: never
    profiles: [mock, mcap]
    depends_on: [task_manager]
    networks:
      - pib-network
    environment:
      - GEORG_MOCK_SCENARIO=${GEORG_MOCK_SCENARIO:-all_ok}
    init: true
    restart: unless-stopped
    command: ros2 run georg_task_manager mock_packages --ros-args -r __ns:=/georg

  # Burr UI: every mission run with all steps and states, http://localhost:7241
  burr_ui:
    image: task_manager
    pull_policy: never
    profiles: [mock, sim, real, mcap]
    depends_on: [task_manager]
    networks:
      - pib-network
    ports:
      - "7241:7241"
    volumes:
      - burr-data:/root/.burr
    environment:
      - burr_path=/root/.burr
    init: true
    restart: unless-stopped
    command: /opt/burr-venv/bin/python -m uvicorn burr.tracking.server.run:app --host 0.0.0.0 --port 7241

volumes:
  burr-data:

networks:
  pib-network:
    driver: bridge
