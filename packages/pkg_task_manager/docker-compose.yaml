services:
  task_manager:
    image: task_manager
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - ./config:/config:ro
      - ./maps:/maps:ro
    environment:
      - GEORG_MAP_DIR=/georg_maps
      - GEORG_DEFAULT_MAP=Nav_Test.yaml
      - MISSION_ID=2

    privileged: true
    init: true
    working_dir: /config
    command: ros2 launch task_manager.launch.py
#    command: ros2 launch task_manager.launch.py robot_namespace:=georg
#    command: sleep 1d

networks:
  pib-network:
    driver: bridge
