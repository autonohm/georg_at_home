services:
  urdf:
    image: urdf
    profiles: [sim, real, mcap]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    privileged: true
    restart: unless-stopped
    init: true
    working_dir: "/georg_urdf"
    command: "ros2 launch georg_description publish_urdf.launch.py"
#    command: sleep 1d

networks:
  pib-network:
    driver: bridge
