services:
  urdf:
    image: urdf
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    profiles: [sim, real, mcap]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    privileged: true
    restart: unless-stopped
    init: true
    working_dir: "/georg_urdf"
    command: "ros2 launch georg_description publish_urdf.launch.py"
#    command: "ros2 launch georg_description publish_urdf.launch.py namespace:=georg"
#    command: sleep 1d

networks:
  # Shared with pib-backend and Cerebra (same fixed name): ROS 2 nodes can always reach each
  # other on the network, the ROS domain alone separates them (real = 0 like pib-backend,
  # mock/sim/mcap = 30). See docs/DECISIONS.md "One network, domains separate".
  pib-network:
    name: pib-network
    driver: bridge
