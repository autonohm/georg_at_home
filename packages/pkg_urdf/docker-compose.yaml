services:
  urdf:
    image: urdf
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    privileged: true
    restart: on-failure
    init: true
    working_dir: "/georg_urdf"
    command: "ros2 launch georg_description publish_urdf.launch.py use_sim_time:=${GEORG_SIM_MODE:-false}"
#    command: "ros2 launch georg_description publish_urdf.launch.py namespace:=georg"
#    command: sleep 1d

networks:
  pib-network:
    driver: bridge
