services:
  viz:
    image: viz
    profiles: [viz]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - /dev:/dev # hwaccel hopefully
      - /tmp/.X11-unix/:/tmp/.X11-unix/
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority
      - ./config/:/root/config:ro
      - ./config/qt5ct/:/root/.config/qt5ct/:ro
    # hardware acceleration
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DISPLAY=${DISPLAY:-}
      - QT_QPA_PLATFORMTHEME=qt5ct
    working_dir: /root/config
    privileged: true
    restart: no
    init: true
    command: ros2 launch ./operator.launch.py
#    command: ros2 launch ./operator.launch.py robot_namespace:=georg
#    command: sleep 1d

  # Lichtblick connects here: ws://<robot>:8765. Panel: lichtblick_panel/ (plan P4)
  foxglove_bridge:
    image: foxglove_bridge
    profiles: [mock, sim, real, mcap]
    build:
      context: .
      dockerfile: ./Dockerfile.bridge
    networks:
      - pib-network
    ports:
      - "8765:8765"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8765'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # min_qos_depth 10: status updates that follow each other within milliseconds
    # (last Burr steps) must not be dropped
    command: ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765 min_qos_depth:=10

networks:
  pib-network:
    driver: bridge
