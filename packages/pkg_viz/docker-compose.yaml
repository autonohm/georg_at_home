services:
  viz:
    image: viz
    profiles: [viz]
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - /dev:/dev # hwaccel hopefully
      - /tmp/.X11-unix/:/tmp/.X11-unix/
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority
      - ./config/:/root/config:ro
      - ./config/qt5ct/:/root/.config/qt5ct/:ro
    # hardware acceleration
    runtime: nvidia
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - DISPLAY=${DISPLAY:-}
      - QT_QPA_PLATFORMTHEME=qt5ct
    working_dir: /root/config
    privileged: true
    restart: no
    init: true
    command: ros2 launch ./operator.launch.py
#    command: ros2 launch ./operator.launch.py robot_namespace:=georg
#    command: sleep 1d

  # Lichtblick connects here: ws://<robot>:8765. Panel: lichtblick_panel/ (plan P4)
  foxglove_bridge:
    image: foxglove_bridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    profiles: [mock, sim, real, mcap]
    build:
      context: .
      dockerfile: ./Dockerfile.bridge
      additional_contexts:
        pib_model_pkg: ../pkg_pib_model/pib_model_pkg
    networks:
      - pib-network
    ports:
      - "8765:8765"
    volumes:
      - ./config/foxglove_bridge.yaml:/config/foxglove_bridge.yaml:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8765'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # port, min_qos_depth 10 (no lost status updates), mesh allowlist: config/foxglove_bridge.yaml
    command: ros2 run foxglove_bridge foxglove_bridge --ros-args --params-file /config/foxglove_bridge.yaml

networks:
  # Shared with pib-backend and Cerebra (same fixed name): ROS 2 nodes can always reach each
  # other on the network, the ROS domain alone separates them (real = 0 like pib-backend,
  # mock/sim/mcap = 30). See docs/DECISIONS.md "One network, domains separate".
  pib-network:
    name: pib-network
    driver: bridge
