services:
  viz:
    image: viz
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - pib-network
    volumes:
      - /dev:/dev # hwaccel hopefully
      - /tmp/.X11-unix/:/tmp/.X11-unix/
      - $XAUTHORITY:/root/.Xauthority
      - ./config/:/root/config:ro
      - ./config/qt5ct/:/root/.config/qt5ct/:ro
    # hardware acceleration
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DISPLAY=$DISPLAY
      - QT_QPA_PLATFORMTHEME=qt5ct
    working_dir: /root/config
    privileged: true
    restart: no
    init: true
    command: ros2 launch ./operator.launch.py
#    command: ros2 launch ./operator.launch.py robot_namespace:=georg
#    command: sleep 1d

networks:
  pib-network:
    driver: bridge
