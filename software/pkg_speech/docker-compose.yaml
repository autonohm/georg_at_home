version: '3'

services:

  rosbridge-ws:
    build:
      context: .
      dockerfile: ./rosbridge/Dockerfile
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml
    networks:
      - pib-network
    restart: always
    ports:
      - "9090:9090"


  ros-voice-assistant:
    image: ros_voice_assistant
    build:
      context: .
      dockerfile: ./voice_assistant/Dockerfile
    command: ros2 launch voice_assistant launch.py
    privileged: true
    profiles:
      - all
      - voice_assistant
    networks:
      - pib-network
    env_file:
      - ros-audio.env
      - password.env
    environment:
      # - ALSA_CARD=ArrayUAC10
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
      - FLASK_API_BASE_URL=http://flask-app:5000
      - VOICE_ASSISTANT_DIR=/app/ros2_ws/voice_assistant
      - PIB_MCP_ROSBRIDGE_URL=ws://rosbridge-ws:9090
      # Hardware-changing MCP calls remain blocked unless explicitly enabled.
      - PIB_MCP_ENABLE_ACTUATION=false
      # Hermes-agent personalities: same profiles dir as flask-app, so the
      # SOUL.md the API writes is the file the agent loads.
      - PIB_HERMES_PROFILES_DIR=/home/pib/.hermes/profiles
      - HERMES_HOME=/home/pib/.hermes
      - PIB_HERMES_BIN=/home/pib/.local/bin/hermes
      # API keys come from the gitignored ./password.env (env_file above), NOT
      # from defaults in this file. No hardcoded key / fallback default is kept.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
      - /media/dyan/project/projects/voice/:/data/voice
      - /dev/snd:/dev/snd
      - /dev/dsp:/dev/dsp
      - /etc/machine-id:/etc/machine-id
      - /home/pib/.hermes:/home/pib/.hermes
      - /home/pib/.local/bin/hermes:/home/pib/.local/bin/hermes:ro
      # REQUIRED, do not remove: the hermes wrapper execs the venv interpreter
      # under /home/pib/.hermes/hermes-agent/venv/bin, and that interpreter is a
      # symlink into uv-managed Python here, outside both mounts above. Without
      # this directory the symlink dangles inside the container and every hermes
      # call dies with exit 127 ("No such file or directory"), which surfaces
      # only as the fallback reply. The container's own python3.12 cannot stand
      # in, since the venv is built against 3.11. Mounted whole rather than as a
      # pinned cpython-3.11.x path, because `hermes update` may change the patch
      # version and would silently break a pinned mount.
      - /home/pib/.local/share/uv:/home/pib/.local/share/uv:ro
    devices:
      - /dev/snd:/dev/snd
      - /dev/bus/usb:/dev/bus/usb1
    restart: always
    depends_on:
      - rosbridge-ws
      - ros-audio-io

  ros-audio-io:
    image: ros-audio-io
    build:
      context: .
      dockerfile: ./ros_audio_io/Dockerfile
    command: ros2 launch ros_audio_io launch.py
    profiles:
      - all
      - ros_audio_io
      - voice_assistant
    networks:
      - pib-network
    env_file:
      - ros-audio.env
    environment:
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
    devices:
      - /dev/snd:/dev/snd
      - /dev/bus/usb:/dev/bus/usb1
    privileged: true
    volumes:
      - /media/dyan/project/projects/voice/:/data/voice
      - /dev/snd:/dev/snd
      - /dev/dsp:/dev/dsp
      - /etc/machine-id:/etc/machine-id
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
      - /home/pib/.config/pulse/cookie:/root/.config/pulse/cookie
      - /home/pib/wav-files:/home/pib/wav-files:ro
    restart: always
    depends_on:
      - rosbridge-ws

volumes:
  programs:

networks:
  pib-network:
    driver: bridge
