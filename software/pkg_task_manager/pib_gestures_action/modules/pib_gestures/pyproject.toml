[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pib-gestures"
version = "1.0.0"
description = "Different gestures for pib considering object coordinates: looking and pointing at objects, greeting persons"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
    { name = "pib.rocks", email = "team@pib.rocks" }
]

dependencies = [
    "pib-sdk",
    "numpy>=1.26"
]

classifiers = [
    "Programming Language :: Python :: 3"
]

[project.scripts]
point_to = "pib_gestures.point_to:main"
greet_person = "pib_gestures.greet_person:main"
look_at = "pib_gestures.look_at:main"
locate_object = "pib_gestures.locate_object:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pib_gestures = [
    "logging_utils/logger.config"
]
